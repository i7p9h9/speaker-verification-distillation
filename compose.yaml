services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    init: true
    working_dir: /workspace/formanta-distill
    command: sleep infinity
    shm_size: 8gb
    gpus: all
    mem_limit: 50g
    memswap_limit: 50g
    volumes:
      - type: bind
        source: .
        target: /workspace/formanta-distill
      # venv, uv-managed Python and uv cache; survives container re-creation.
      - type: volume
        source: uv-data
        target: /opt/uv

volumes:
  uv-data:
