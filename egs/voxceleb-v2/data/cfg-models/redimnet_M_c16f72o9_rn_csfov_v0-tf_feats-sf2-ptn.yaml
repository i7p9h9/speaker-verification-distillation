#-----------------------------------------------
# For tfrecord/cloud tfrecords based train data:
#-----------------------------------------------
data_type: 'tfrec'
train_data:
  ? gs://idvoice-eu4/data/verification/voxceleb/vox4-train/auto-filt/1st-chunk-10k-speakers/tfrecord/8sec-1utt-per-spk-bs512-pcm-16bit-gzip
  : 0.5
  ? gs://idvoice-eu4/data/verification/voxceleb/vox4-train/auto-filt/2nd-chunk-18k-speakers/tfrecord/8sec-1utt-per-spk-bs512-pcm-16bit-gzip
  : 0.2
  ? gs://idvoice-eu4/data/verification/voxceleb/vox4-train/auto-filt/3rd-chunk-15k-speakers/tfrecord/8sec-1utt-per-spk-bs512-pcm-16bit-gzip
  : 0.2
  ? gs://idvoice-eu4/data/verification/voxceleb/vox4-train/4th-chunk/tfrecord/8sec-1utt-per-spk-bs512-pcm-16bit-gzip
  : 0.05
  ? gs://idvoice-eu4/data/verification/voxceleb/voxtube/tfrecord/vox4-1_4chunks-filt/8sec-1utt-per-spk-bs512-pcm-16bit-gzip
  : 0.05

# Turns off mixup if mixup_alpha is not null, default is 0.5 for mixup training
mixup_alpha: null

# Duration of eval utterance crops
eval_dur: 2.0

#------------------------------
# For locally based validation:
#------------------------------
# val_type: 'local'
# validation: 
#   vox1: '/mnt/data/vox1-test'
#   eci2: '/mnt/data/ECI2a_test'

#-----------------------------------------------
# For tfrecord/cloud tfrecords based validation:
#-----------------------------------------------
full_val: False
val_type: 'tfrec'
validation:
  # cirrus-test:
  # - gs://idvoice-eu4/data/verification/chinese-datasets/cirrus-noisy/tfrecord
  eci2-dev:
  - gs://idvoice-eu4/data/verification/chinese-datasets/eci2-dev/tfrecord/command/female
  - gs://idvoice-eu4/data/verification/chinese-datasets/eci2-dev/tfrecord/command/male
  soduc2-dev:
  - gs://idvoice-eu4/data/verification/chinese-datasets/soduc2-dev/tfrecord/validation/command/female
  - gs://idvoice-eu4/data/verification/chinese-datasets/soduc2-dev/tfrecord/validation/command/male
  vox1-test:
  - gs://idvoice-eu4/data/verification/voxceleb/vox1-test/tfrecord/female
  - gs://idvoice-eu4/data/verification/voxceleb/vox1-test/tfrecord/male

# Model definition
model: ReDimNetCustom
model_args:
  C: 16
  F: 72
  block_1d_type: conv+att
  block_2d_type: basic_resnet
  emb_bn: false
  embed_dim: 192
  feat_type: tf
  global_context_att: false
  group_divisor: 16
  hop_length: 280
  out_channels: null
  pooling_func: ASTP
  spec_params:
    do_preemph: true
    do_spec_aug: true
    freq_mask_width:
    - 0
    - 6
    freq_start_bin: 24
    norm_signal: true
    time_mask_width:
    - 0
    - 6
  stages_setup:
  - - 1
    - 4
    - 2
    - - - 3
        - 3
    - 16
  - - 2
    - 5
    - 2
    - - - 3
        - 3
    - 16
  - - 1
    - 6
    - 2
    - - - 3
        - 3
    - 16
  - - 2
    - 8
    - 1
    - - - 3
        - 3
    - 16
  - - 1
    - 8
    - 1
    - - - 3
        - 3
    - 16
  - - 2
    - 3
    - 1
    - - - 3
        - 3
    - 8

# Loss/head(projection) definition
projection_args:
  do_lm: false
  easy_margin: false
  embed_dim: 192
  lanbuda: 0.7
  margin_type: C
  num_class: 17904
  project_type: sphereface2
  scale: 32.0
  t: 3
  
# Margin scheduler definition
margin_scheduler: MarginScheduler
margin_update:
  initial_margin: 0.0
  final_margin: 0.235
  increase_start_epoch: 30
  fix_start_epoch: 80
  update_margin: True
  increase_type: "exp" # exp, linear

loss: CrossEntropyLoss
loss_args: {}

# Learning Rate scheduler definition
optimizer: SGD
optimizer_args:
  momentum: 0.9
  nesterov: True
  weight_decay: 0.00001
loss_weight_decay_mult: 2.0

# Learning Rate scheduler definition
scheduler: ExponentialDecrease
scheduler_args:
  initial_lr: 0.1
  final_lr: 0.00007
  warm_up_epoch: 6
  warm_from_zero: True