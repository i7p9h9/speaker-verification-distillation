### train configuraton

exp_dir: exp/redimnet_SM_c16f72o3x15ms_rn_catt-vox4_chunks_1234_vt-ptn_200eps
gpus: 
- 0
- 1
- 2
- 3
num_avg: 10 # Dummy stuff, used somewhere but doesn't play any role for us
enable_amp: True # whether enable automatic mixed precision training

seed: 42
num_epochs: 200
save_epoch_interval: 5 # save model every 5 epochs
log_batch_interval: 25 # log every 100 batchs

dataloader_args:
  batch_size: 140
  num_workers: 16
  pin_memory: False
  prefetch_factor: 2
  drop_last: True

dataset_args:
  # the sample number which will be traversed within one epoch, if the value equals to 0,
  # the utterance number in the dataset will be used as the sample_num_per_epoch.
  sample_num_per_epoch: 1120000 
  shuffle: True
  resample_rate: 16000 # sampling rate of training samples
  speed_perturb: False # whether to apply speed augmentation -> generates x3 speakers
  num_frms: 240 # Num frames defines training samples len, 300 ~ 3 sec training utterances crops
  fbank_args:
    num_mel_bins: 80
    frame_shift: 10
    frame_length: 25
    dither: 1.0

#--------------------------------
# For localy based augmentations:
#--------------------------------
  aug_setup:
    type: 'wespeaker_augs'
    preset: 'hard-tf'
    aug_prob: 0.8 # prob to add reverb & noise aug per sample
    reverb_lmdb_file: '/mnt/artifactsnfs/iyakovlev/wespeaker-data/rirs/lmdb'
    noise_lmdb_file: '/mnt/artifactsnfs/iyakovlev/wespeaker-data/musan/lmdb'
    
