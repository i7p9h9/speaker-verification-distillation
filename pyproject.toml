[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voicesdk"
version = "0.0.1"
requires-python = ">=3.11,<3.13"
dependencies = [
    "audimentation",
    "h5py>=3.11,<4",
    "librosa>=0.10.2,<0.12",
    "lightning>=2.5,<2.6",
    "matplotlib>=3.9,<4",
    "numpy>=1.26,<3",
    "pytorch-lightning>=2.5,<2.6",
    "pyyaml>=6,<7",
    "resampy>=0.4.3,<0.5",
    "scikit-learn>=1.5,<2",
    "scipy>=1.13,<2",
    "soundfile>=0.12,<0.14",
    "tensorboard>=2.18,<3",
    "torch==2.13.0",
    "torchaudio==2.11.0",
    "tqdm>=4.66,<5",
]

# Linux GPU builds; other platforms use PyPI.
[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux'" }]
audimentation = { path = "../audiment", editable = true }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.setuptools.packages.find]
where = ["."]
include = ["voicesdk*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
